<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logistic Regression Playground</title>
<style>
:root {
  --bg: #f7f7f5; --card: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e2e2e0;
  --code-bg: #f3f3f1; --out-bg: #fbfbfa;
  --c0: #8e44ad; --c1: #e3a400; --c1-text: #9a6f00; --curve: #333;
  --good: #1a9b3c; --bad: #d62828; --TP: var(--good); --TN: var(--good); --FP: var(--bad); --FN: var(--bad); --gray: #c4c4c4;
  --thr: #0a74c2; --btn: #0a74c2; --accent: #2457c5;
  --grid: #ebebeb; --panel: #ebebeb;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161618; --card: #1f1f22; --ink: #ececee; --muted: #a0a0a8; --line: #333338;
    --code-bg: #26262a; --out-bg: #1b1b1e; --good: #3fc463; --bad: #ff5a5a; --TP: var(--good); --TN: var(--good); --FP: var(--bad); --FN: var(--bad); --gray: #55555c;
    --thr: #4fb6f2; --btn: #1d8fd6; --accent: #7aa2ff; --grid: #2c2c31; --panel: #232327; --c0: #c08ae0; --c1: #f5c518; --c1-text: #f5c518; --curve: #ddd;
  }
}
:root[data-theme="dark"] {
  --bg: #161618; --card: #1f1f22; --ink: #ececee; --muted: #a0a0a8; --line: #333338;
  --code-bg: #26262a; --out-bg: #1b1b1e; --good: #3fc463; --bad: #ff5a5a; --TP: var(--good); --TN: var(--good); --FP: var(--bad); --FN: var(--bad); --gray: #55555c;
  --thr: #4fb6f2; --btn: #1d8fd6; --accent: #7aa2ff; --grid: #2c2c31; --panel: #232327; --c0: #c08ae0; --c1: #f5c518; --c1-text: #f5c518; --curve: #ddd;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 1.6rem; margin: 0 0 12px; }
.sub { color: var(--muted); margin: 0 0 20px; }
h2 { font-size: 1rem; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.row { display: grid; gap: 16px; margin-bottom: 16px; }
.row.top { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
.row.bottom { grid-template-columns: minmax(0, 1.7fr) minmax(280px, 1fr); }
@media (max-width: 860px) {
  .row.top, .row.bottom { grid-template-columns: minmax(0, 1fr); }
}
pre { margin: 0; overflow-x: auto; font: 13.5px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
pre.code { background: var(--code-bg); padding: 12px; border-radius: 6px; }
pre.out { background: var(--out-bg); border: 1px solid var(--line); padding: 12px; border-radius: 6px; margin-top: 8px; color: var(--muted); }
pre + pre.code { margin-top: 12px; }
.kw { color: #a626a4; } .str { color: #50a14f; } .num { color: #c18401; } .com { color: #8a8a8a; font-style: italic; } .fn { color: #4078f2; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .kw { color: #d699e0; } :root:not([data-theme="light"]) .str { color: #98c379; } :root:not([data-theme="light"]) .num { color: #e5c07b; } :root:not([data-theme="light"]) .fn { color: #7fb0ff; } }
.formula { font-family: "Times New Roman", Georgia, serif; font-size: 1.25rem; line-height: 2; }
.formula .var { font-family: ui-monospace, Menlo, monospace; font-size: .95rem; }
.formula .step { color: var(--muted); font-family: inherit; font-size: .85rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: block; margin-top: 10px; line-height: 1.4; }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 4px; }
.frac > span:first-child { border-bottom: 1px solid currentColor; padding: 0 4px; line-height: 1.3; }
.frac > span:last-child { line-height: 1.3; padding: 0 4px; }
.thr-val { color: var(--thr); font-weight: 600; }
.plothead { display: flex; justify-content: space-between; align-items: center; gap: 8px 16px; flex-wrap: wrap; margin-bottom: 4px; }
.ptitle { font-size: 1.05rem; font-weight: 700; line-height: 1.3; }
.psub { color: var(--muted); font-size: .85rem; font-style: italic; }
button#toggle { font-size: .95rem; padding: 8px 14px; min-width: 13.5em; box-shadow: 0 1px 4px rgba(10, 116, 194, .3); }
button#toggle.active { box-shadow: none; }
.plothead h2 { margin: 0; }
button {
  font: inherit; font-size: 1.15rem; padding: 12px 24px; border-radius: 10px; cursor: pointer;
  border: 2px solid var(--btn); background: var(--btn); color: #fff; font-weight: 700;
  box-shadow: 0 2px 8px rgba(10, 116, 194, .3);
}
button:hover { filter: brightness(1.08); }
button.active { background: var(--card); color: var(--btn); box-shadow: none; }
svg { width: 100%; height: auto; display: block; touch-action: none; user-select: none; }
.axis text { fill: var(--muted); font-size: 12px; }
.axis-title { fill: var(--ink); font-size: 13px; }
.plot-sub { fill: var(--muted); font-size: 13.5px; font-style: italic; }
.plot-title { fill: var(--ink); font-size: 17px; font-weight: 700; }
.legend { display: flex; gap: 16px; font-size: .9rem; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.legend .c0::before { background: var(--c0); } .legend .c1::before { background: var(--c1); }
.legend .ok::before, .legend .no::before { display: none; }
.legend .c::before { width: 18px; height: 0; border-radius: 0; border-top: 2.5px solid var(--curve); vertical-align: 4px; }
.curve-label { fill: var(--curve); font-size: 14px; font-weight: 600; font-style: italic; }
#plotwrap { position: relative; }
#tip { display: none; position: absolute; pointer-events: none; z-index: 5; background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.15); padding: 10px 12px; font-size: .88rem; line-height: 1.55; white-space: nowrap; }
#tip .tt-h { font-weight: 600; margin-bottom: 4px; }
#tip .tt-f { font-family: "Times New Roman", Georgia, serif; font-size: 1rem; }
#tip b.c1 { color: var(--c1-text); } #tip b.c0 { color: var(--c0); }
#tip .tt-sep { border-top: 1px solid var(--line); margin: 6px 0; }
#tip .tt-res { font-weight: 700; }
.pt { cursor: default; }
.legend .k b { font-weight: 700; } .legend .k::before { display: none; }
.handle { cursor: ns-resize; }
#eval { display: none; }
.on #eval { display: block; }
.on #info { display: none; }
#info ol { margin: 0; padding-left: 1.3em; }
#info li { margin-bottom: 12px; }
#info .btnref { color: var(--btn); font-weight: 700; white-space: nowrap; }
.thr-label.thr-hint { font-size: 12px; font-weight: 500; font-style: italic; }
.thr-label { fill: var(--thr); font-size: 13px; font-weight: 700; paint-order: stroke; stroke: var(--card); stroke-width: 4px; stroke-linejoin: round; }
.readout { font-size: .95rem; margin-bottom: 14px; }
.readout .big { font-weight: 600; color: var(--thr); }
td.cell:hover, td.cell.hl { background: var(--panel); }
table.cm { border-collapse: collapse; width: 100%; margin-bottom: 16px; font-size: .9rem; }
table.cm th, table.cm td { border: 1px solid var(--line); padding: 8px; text-align: center; }
table.cm th { font-weight: 600; color: var(--muted); }
td.cell { cursor: default; }
td.cell { vertical-align: top; color: var(--c); }
td.cell b { display: block; font-size: 1.5rem; line-height: 1.2; }
td.cell .nm { display: block; font-weight: 700; font-size: .85rem; }
td.cell small { display: block; font-size: .76rem; line-height: 1.3; margin-top: 2px; }
td.cell.hl { box-shadow: inset 0 0 0 2px var(--c); }
td.cell small { color: var(--muted); }
.metrics { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: .95rem; }
.metrics .v { text-align: right; font-variant-numeric: tabular-nums; }
.metrics .v small { color: var(--muted); }
.mlab { position: relative; cursor: help; }
.mlab > span:first-child { border-bottom: 1px dotted var(--muted); }
.mtip { display: none; position: absolute; left: 0; bottom: calc(100% + 6px); width: 270px; z-index: 6; background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.15); padding: 10px 12px; font-size: .85rem; line-height: 1.45; color: var(--ink); }
.mlab:hover .mtip, .mlab:focus .mtip { display: block; }
.mlab:focus { outline: none; } .mlab:focus > span:first-child { border-bottom-color: var(--accent); }
.credit { text-align: center; color: var(--muted); font-size: .85rem; margin-top: 24px; }
.hint { font-size: .8rem; color: var(--muted); margin-top: 12px; }
.pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
button.pill { font-size: .95rem; font-weight: 600; padding: 6px 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); color: var(--muted); box-shadow: none; }
button.pill > span { margin-right: .3em; }
button.pill.active { padding: 5px 15px; border: 2.5px solid var(--ink); color: var(--ink); box-shadow: 0 2px 4px rgba(0, 0, 0, .18); cursor: default; filter: none; }
button.pill:not(.active):hover { color: var(--ink); border-color: var(--muted); filter: none; }
#info code { font: .88em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--code-bg); padding: 1px 4px; border-radius: 4px; }
.note { font-size: .88rem; color: var(--muted); margin: -4px 0 14px; padding-left: 10px; border-left: 3px solid var(--FP); }
</style>
</head>
<body>
<main>
  <h1>Logistic Regression Playground</h1>
  <div class="pills" role="tablist" aria-label="Example dataset">
    <button type="button" class="pill" role="tab" data-ds="penguins"><span aria-hidden="true">🐧</span> Penguins</button>
    <button type="button" class="pill" role="tab" data-ds="spam"><span aria-hidden="true">✉️</span> Spam</button>
  </div>

  <div class="row bottom" id="bottom">
    <section class="card">
      <div class="plothead">
        <div><div class="ptitle" id="ptitle"></div><div class="psub" id="psub"></div></div>
        <button id="toggle" type="button" aria-pressed="false">Set decision threshold</button>
      </div>
      <div id="plotwrap"><svg id="plot" viewBox="0 0 760 438"></svg><div id="tip" role="tooltip"></div></div>
      <div class="legend" id="legend"></div>
    </section>

    <aside class="card" id="panel">
     <div id="info"></div>
     <div id="eval"></div>
    </aside>
  </div>
  <div class="row top">
    <section class="card" id="code"></section>
    <section class="card" id="formula"></section>
  </div>
  <footer class="credit">Stat 20 | Designed in Fall 2026 by Everett Wetchler and Claude</footer>
</main>

        <li>Each dot is one email. <b>Hover over an email</b> to see how the model calculates its probability of being spam.</li>
        <li><b>The curve slopes down.</b> <i>Longer</i> emails are <i>less</i> likely to be spam. Spam tends to be short in this dataset. The coefficient on <code>log10(n_chars)</code> is negative, so the predicted probability falls as emails get longer.</li>
        <li><b>The data isn't 50-50.</b> The penguins data was about 50-50 male-female. Here, only 30% of emails are spam. That makes our job harder, because if we lower the “send it to spam” threshold, we're going to catch more real email along with it.</li>
        <li><b>Scroll down</b> to read the R code that fit the model and the formula it uses to make predictions.</li>
        <li>Then click the <span class="btnref">Set decision threshold</span> button. Emails with a probability above the threshold go to the spam folder. A real email hidden in the spam folder is much worse than one spam email reaching your inbox. Where would you set it?</li>
      </ol>`,
      metricNotes: {
        mcr: "Since only 30% of our emails are actually spam, a very dumb model that just said “nothing is spam” would only be wrong 30% of the time! So an MCR of 30% is unimpressive. We need to do better than that for our model to be worth anything.",
        prec: "Interpretation: Of everything we put in the spam folder (TP + FP), how much of it was really spam (TP)? When precision is low, real email is getting hidden.",
        rec: "Interpretation: How much of the real spam (TP + FN) did we catch (TP)? When recall is low, spam is getting through to the inbox."
      },
      evalNote: `<p class="note">A false positive hides a real email in the spam folder. A false negative lets one spam email into the inbox.</p>`,
      tipHead: d => `${fmtN(d.raw)}-character email`,
      tipX: d => `<div class="tt-f">log<sub>10</sub>(${fmtN(d.raw)}) = ${d.x.toFixed(2)}</div>`,
      tipZ: d => `<i>z</i> = 4.001 − 1.451 × ${d.x.toFixed(2)} = ${d.z.toFixed(2)}`,
      everyPos: "Every email goes to the spam folder.",
      everyNeg: "Every email goes to the inbox.",
      cutRule: cut => {
        const n = Math.pow(10, cut);
        return n < 1 ? "No email is short enough to go to the spam folder."
          : `Same as sending emails shorter than ${fmtN(n)} characters to the spam folder`;
      },
      code: `<h2>Code and output</h2>
<pre class="code"><span class="com"># not spam = 0, spam = 1, so the model predicts P(spam)</span>
model2 = <span class="fn">glm</span>(spam ~ <span class="fn">log10</span>(n_chars), data = emails, family = <span class="str">"binomial"</span>)
model2</pre>
<pre class="out">Call:  glm(formula = spam ~ log10(n_chars), family = "binomial", data = emails)

Coefficients:
   (Intercept)  log10(n_chars)
         4.001          -1.451</pre>
<pre class="code">emails = emails |&gt;
    <span class="fn">mutate</span>(p_spam = <span class="fn">predict</span>(model2, type = <span class="str">"response"</span>))</pre>`,
      formula: `<h2>How the model predicts</h2>
      <div class="formula">
        <span class="step">1. Linear component</span>
        <i>z</i> = 4.001 − 1.451 × <span class="var">log10(n_chars)</span>
        <span class="step">2. Send it through the sigmoid to get a probability</span>
        <i>P</i>(spam) =
        <span class="frac"><span>1</span><span>1 + <i>e</i><sup>−<i>z</i></sup></span></span>
        <span class="step">Example: a typical 1000-character email, so log<sub>10</sub>(n_chars) = 3</span>
        <i>z</i> = 4.001 − 1.451 × 3 = −0.352<br>
        <i>P</i>(spam) = 1 / (1 + <i>e</i><sup>0.352</sup>) = 0.41
        <span class="step">There is a 41% chance that a 1000-character email is spam, according to this model.</span>
      </div>`
    }
  };

  const W = 760, H = 438, M = { l: 100, r: 46, t: 14, b: 52 };
  const Y0 = -0.12, Y1 = 1.12;
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs = {}, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const $ = id => document.getElementById(id);
  const svg = $("plot"), tip = $("tip"), wrap = $("plotwrap");
  const sy = v => M.t + (Y1 - v) / (Y1 - Y0) * (H - M.t - M.b);
  const CHECK = "M-5,0.5 L-1.6,4 L5,-4.2";
  const XMARK = "M-4,-4 L4,4 M4,-4 L-4,4";
  const NAMES = { TP: "true positive", TN: "true negative", FP: "false positive", FN: "false negative" };
  const fmtPct = (a, b) => b === 0 ? `undefined <small>(0/0)</small>` : `${(100 * a / b).toFixed(1)}% <small>(${a}/${b})</small>`;

  // state
  let D, pts, N, sx, on = false, t = 0.5, hl = null, hover = null, dragging = false;
  let marks, guide, gline, gdot, thrG, hit, tline, tlabel, handles;
  const cat = d => (d.p > t ? (d.y ? "TP" : "FP") : (d.y ? "FN" : "TN"));

  const mlab = (label, note) => `<span class="mlab" tabindex="0"><span>${label}</span><span class="mtip" role="tooltip">${note}</span></span>`;
  function evalHTML() {
    const cell = (k, pred, act) => `<td class="cell" data-k="${k}" style="--c: var(--${k})"><b id="c${k}"></b><span class="nm">${k}: ${NAMES[k]}</span><small>${pred}, actually ${act}</small></td>`;
    return `<h2>Model evaluation</h2>
      <div class="readout">
        <span class="big">threshold = <span id="tVal">0.50</span></span>
        <div id="massRule"></div>
      </div>
      ${D.evalNote}
      <h2>Confusion matrix</h2>
      <table class="cm">
        <tr><th></th><th><i>Y</i> = 0<br><small>${D.neg}</small></th><th><i>Y</i> = 1<br><small>${D.pos}</small></th></tr>
        <tr><th><i>Ŷ</i> = 0<br><small>${D.predNeg}</small></th>${cell("TN", D.predNeg, D.neg)}${cell("FN", D.predNeg, D.pos)}</tr>
        <tr><th><i>Ŷ</i> = 1<br><small>${D.predPos}</small></th>${cell("FP", D.predPos, D.neg)}${cell("TP", D.predPos, D.pos)}</tr>
      </table>
      <h2>Metrics</h2>
      <div class="metrics">
        ${mlab("MCR = (FP + FN) / <i>n</i>", D.metricNotes.mcr)}<span class="v" id="mMCR"></span>
        ${mlab("Precision = TP / (TP + FP)", D.metricNotes.prec)}<span class="v" id="mPrec"></span>
        ${mlab("Recall = TP / (TP + FN)", D.metricNotes.rec)}<span class="v" id="mRec"></span>
      </div>
      <p class="hint">Drag the blue threshold line or its handle. Hover a cell to highlight those ${D.units}, or hover ${D.unit === "email" ? "an" : "a"} ${D.unit} to see its calculation. Hover a metric to see what it means.</p>`;
  }

  function build(key) {
    D = DATASETS[key];
    on = false; t = 0.5; hl = null; hover = null; dragging = false;
    tip.style.display = "none";
    document.querySelectorAll(".pill").forEach(b => {
      const a = b.dataset.ds === key;
      b.classList.toggle("active", a); b.setAttribute("aria-selected", a);
    });
    $("toggle").classList.remove("active"); $("toggle").setAttribute("aria-pressed", false);
    $("toggle").textContent = "Set decision threshold";
    $("bottom").classList.remove("on");

    $("info").innerHTML = `<h2>How to use this tool</h2>${D.info}`;
    $("eval").innerHTML = evalHTML();
    $("code").innerHTML = D.code;
    $("formula").innerHTML = D.formula;
    document.querySelectorAll("[data-k]").forEach(e => {
      e.addEventListener("mouseenter", () => { hl = e.dataset.k; render(); });
      e.addEventListener("mouseleave", () => { hl = null; render(); });
    });

    const { B0, B1, X0, X1 } = D;
    sx = x => M.l + (x - X0) / (X1 - X0) * (W - M.l - M.r);
    pts = D.raw.map(([raw, y]) => { const x = D.toX(raw), z = B0 + B1 * x; return { raw, x, y, z, p: sig(z) }; });
    N = pts.length;

    svg.innerHTML = "";
    svg.setAttribute("aria-label", D.aria);
    el("rect", { x: M.l, y: M.t, width: W - M.l - M.r, height: H - M.t - M.b, fill: "var(--panel)", opacity: 0.45 }, svg);
    const axis = el("g", { class: "axis" }, svg);
    D.ticks.forEach(({ v, label }) => {
      el("line", { x1: sx(v), x2: sx(v), y1: M.t, y2: H - M.b, stroke: "var(--grid)", "stroke-width": 1.2 }, axis);
      if (label) el("text", { x: sx(v), y: H - M.b + 18, "text-anchor": "middle" }, axis).textContent = label;
    });
    if (D.ends) {
      el("text", { x: M.l, y: H - M.b + 18, "text-anchor": "start" }, axis).textContent = D.ends[0];
      el("text", { x: W - M.r, y: H - M.b + 18, "text-anchor": "end" }, axis).textContent = D.ends[1];
    }
    for (let v = 0; v <= 1.0001; v += 0.25) {
      el("line", { x1: M.l, x2: W - M.r, y1: sy(v), y2: sy(v), stroke: "var(--grid)", "stroke-width": 1.2 }, axis);
      const lab = v === 1 ? `${D.pos}  1.00` : v === 0 ? `${D.neg}  0.00` : v.toFixed(2);
      el("text", { x: M.l - 8, y: sy(v) + 4, "text-anchor": "end" }, axis).textContent = lab;
    }
    $("ptitle").textContent = D.title;
    $("psub").textContent = `Try hovering over individual points (${D.units})!`;
    const xt = el("text", { x: (M.l + W - M.r) / 2, y: H - 10, "text-anchor": "middle", class: "axis-title" }, svg);
    if (Array.isArray(D.xTitle)) {
      let shifted = false;
      D.xTitle.forEach(([txt, sub]) => {
        const a = sub ? { dy: 4, "font-size": 10 } : shifted ? { dy: -4 } : {};
        el("tspan", a, xt).textContent = txt; shifted = !!sub;
      });
    } else xt.textContent = D.xTitle;
    const yc = (M.t + H - M.b) / 2;
    el("text", { x: 16, y: yc, "text-anchor": "middle", class: "axis-title", transform: `rotate(-90 16 ${yc})` }, svg).textContent = D.yTitle;

    // fitted curve
    let dpath = "";
    for (let i = 0; i <= 200; i++) {
      const x = X0 + (X1 - X0) * i / 200;
      dpath += (i ? "L" : "M") + sx(x).toFixed(1) + "," + sy(sig(B0 + B1 * x)).toFixed(1);
    }
    el("path", { d: dpath, fill: "none", stroke: "var(--curve)", "stroke-width": 2.5 }, svg);
    el("text", { x: sx(D.curveAt), y: sy(sig(B0 + B1 * D.curveAt)) + (D.curveDy ?? -12), class: "curve-label", "text-anchor": D.curveAnchor }, svg).textContent = D.curveLabel;

    // cutoff guide (where the threshold meets the curve)
    guide = el("g", { display: "none", "pointer-events": "none" }, svg);
    gline = el("line", { y1: M.t, y2: H - M.b, stroke: "var(--thr)", "stroke-width": 1.2, "stroke-dasharray": "2 4", opacity: 0.8 }, guide);
    gdot = el("circle", { r: 4.5, fill: "var(--thr)" }, guide);

    // marks
    marks = el("g", {}, svg);
    pts.forEach(d => {
      d.g = el("g", { transform: pos(d), class: "pt" }, marks);
      d.dot = el("circle", { r: 4.2, fill: d.y ? "var(--c1)" : "var(--c0)", "fill-opacity": 0.3 }, d.g);
      d.glyph = el("path", { fill: "none", "stroke-width": 2.2, "stroke-linecap": "round", "stroke-linejoin": "round", display: "none" }, d.g);
      el("circle", { r: 6, fill: "transparent" }, d.g);
      d.g.addEventListener("pointerenter", e => { if (dragging) return; hover = d; tip.style.display = "block"; render(); placeTip(e); });
      d.g.addEventListener("pointermove", e => { if (hover === d) placeTip(e); });
      d.g.addEventListener("pointerleave", () => { if (hover === d) { hover = null; tip.style.display = "none"; render(); } });
    });

    // threshold line + handle
    thrG = el("g", { display: "none" }, svg);
    hit = el("line", { x1: M.l, x2: W - M.r + 26, stroke: "transparent", "stroke-width": 14, class: "handle" }, thrG);
    tline = el("line", { x1: M.l, x2: W - M.r, stroke: "var(--thr)", "stroke-width": 2.5, "stroke-dasharray": "8 6", "pointer-events": "none" }, thrG);
    tlabel = el("text", { x: W - M.r - 6, "text-anchor": "end", class: "thr-label", "pointer-events": "none" }, thrG);
    const thint = el("text", { x: W - M.r - 6, "text-anchor": "end", class: "thr-label thr-hint", "pointer-events": "none" }, thrG);
    thint.textContent = "(click and drag this up and down)";
    thint.dataset.hint = "1";
    handles = [W - M.r + 15].map(x => {
      const h = el("g", { class: "handle" }, thrG);
      el("circle", { cx: x, cy: 0, r: 12, fill: "var(--thr)" }, h);
      el("path", { d: `M${x - 4.5},-3 l4.5,-4.5 l4.5,4.5 M${x - 4.5},3 l4.5,4.5 l4.5,-4.5`, stroke: "#fff", "stroke-width": 2, fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round" }, h);
      return h;
    });
    [hit, ...handles].forEach(h => h.addEventListener("pointerdown", e => {
      dragging = true; hover = null; tip.style.display = "none";
      svg.setPointerCapture(e.pointerId); t = toT(e); render(); e.preventDefault();
    }));

    setLegend(); render();
  }

  const pos = d => `translate(${sx(d.x)},${sy(d.y)})`;

  function render() {
    const c = { TP: 0, TN: 0, FP: 0, FN: 0 };
    pts.forEach(d => {
      const k = cat(d); c[k]++;
      const big = d === hover || (hl && k === hl);
      if (!on) {
        d.dot.setAttribute("display", ""); d.glyph.setAttribute("display", "none");
        d.dot.setAttribute("fill-opacity", d === hover ? 0.95 : 0.3);
        d.g.setAttribute("transform", pos(d) + ` scale(${big ? 1.5 : 1})`);
        return;
      }
      const ok = k === "TP" || k === "TN";
      const dim = hl && k !== hl;
      d.dot.setAttribute("display", "none");
      d.glyph.setAttribute("display", "");
      d.glyph.setAttribute("d", ok ? CHECK : XMARK);
      d.glyph.setAttribute("stroke", dim ? "var(--gray)" : `var(--${k})`);
      d.glyph.setAttribute("stroke-opacity", dim ? 0.35 : big ? 0.95 : 0.45);
      d.g.setAttribute("transform", pos(d) + ` scale(${big ? 1.6 : 1})`);
      if (big && hl) marks.appendChild(d.g);
    });
    const y = sy(t);
    [hit, tline].forEach(l => { l.setAttribute("y1", y); l.setAttribute("y2", y); });
    tlabel.setAttribute("y", y - 8); tlabel.textContent = `threshold = ${t.toFixed(2)}`;
    thrG.querySelector("[data-hint]").setAttribute("y", y + 18);
    handles.forEach(h => { h.setAttribute("transform", `translate(0,${y})`); });

    for (const k in c) $("c" + k).textContent = c[k];
    $("tVal").textContent = t.toFixed(2);
    let rule, cut = null;
    if (t <= 0) rule = D.everyPos;
    else if (t >= 1) rule = D.everyNeg;
    else {
      cut = (Math.log(t / (1 - t)) - D.B0) / D.B1;
      rule = D.cutRule(cut);
    }
    const showGuide = on && cut !== null && cut > D.X0 && cut < D.X1;
    guide.setAttribute("display", showGuide ? "" : "none");
    if (showGuide) { gline.setAttribute("x1", sx(cut)); gline.setAttribute("x2", sx(cut)); gdot.setAttribute("cx", sx(cut)); gdot.setAttribute("cy", y); }
    $("massRule").innerHTML = rule;
    $("mMCR").innerHTML = fmtPct(c.FP + c.FN, N);
    $("mPrec").innerHTML = fmtPct(c.TP, c.TP + c.FP);
    $("mRec").innerHTML = fmtPct(c.TP, c.TP + c.FN);
    document.querySelectorAll("[data-k]").forEach(e => e.classList.toggle("hl", e.dataset.k === hl));
    if (hover) fillTip(hover);
  }

  // hover box for a single point
  function fillTip(d) {
    const lab = d.y ? D.pos : D.neg;
    let html = `<div class="tt-h">${D.tipHead(d)}, actually <b class="${d.y ? "c1" : "c0"}">${lab}</b></div>
      ${D.tipX(d)}
      <div class="tt-f">${D.tipZ(d)}</div>
      <div class="tt-f"><i>P</i>(${D.pos}) = 1 / (1 + <i>e</i><sup>${d.z >= 0 ? "−" : ""}${Math.abs(d.z).toFixed(2)}</sup>) = <b>${d.p.toFixed(3)}</b></div>`;
    if (on) {
      const k = cat(d), ok = k === "TP" || k === "TN", pp = d.p > t;
      html += `<div class="tt-sep"></div>
        <div>${d.p.toFixed(3)} ${pp ? "&gt;" : "≤"} <span class="thr-val">${t.toFixed(2)}</span> threshold → ${pp ? D.predPos : D.predNeg}</div>
        <div class="tt-res" style="color: var(--${k})">${ok ? "✓ Correct" : "✗ Wrong"}: ${NAMES[k]} (${k})</div>`;
    }
    tip.innerHTML = html;
  }
  function placeTip(e) {
    const r = wrap.getBoundingClientRect();
    let x = e.clientX - r.left + 14, y = e.clientY - r.top + 14;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    if (x + tw > r.width) x = e.clientX - r.left - tw - 14;
    if (y + th > r.height) y = e.clientY - r.top - th - 14;
    tip.style.left = Math.max(0, x) + "px"; tip.style.top = Math.max(0, y) + "px";
  }

  function setLegend() {
    $("legend").innerHTML = (on
      ? `<span class="k" style="color: var(--good)"><b>✓</b> correct prediction (TP or TN)</span><span class="k" style="color: var(--bad)"><b>✗</b> wrong prediction (FP or FN)</span>`
      : `<span class="c0">${D.neg}</span><span class="c1">${D.pos}</span>`) + `<span class="c">${D.curveLabel}</span>`;
  }

  $("toggle").addEventListener("click", () => {
    on = !on; hl = null;
    $("toggle").classList.toggle("active", on);
    $("toggle").setAttribute("aria-pressed", on);
    $("toggle").textContent = on ? "Hide decision threshold" : "Set decision threshold";
    $("bottom").classList.toggle("on", on);
    thrG.setAttribute("display", on ? "" : "none");
    setLegend(); render();
  });

  // dragging the threshold
  const toT = evt => {
    const pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    const v = Y1 - (p.y - M.t) / (H - M.t - M.b) * (Y1 - Y0);
    return Math.min(1, Math.max(0, v));
  };
  svg.addEventListener("pointermove", e => { if (dragging) { t = toT(e); render(); } });
  const stop = () => { dragging = false; };
  svg.addEventListener("pointerup", stop); svg.addEventListener("pointercancel", stop);

  // dataset pills (#spam in the URL opens the spam example)
  document.querySelectorAll(".pill").forEach(b => b.addEventListener("click", () => {
    if (b.classList.contains("active")) return;
    history.replaceState(null, "", b.dataset.ds === "penguins" ? location.pathname + location.search : "#" + b.dataset.ds);
    build(b.dataset.ds);
  }));
  build(DATASETS[location.hash.slice(1)] ? location.hash.slice(1) : "penguins");
})();
</script>
</body>
</html>
